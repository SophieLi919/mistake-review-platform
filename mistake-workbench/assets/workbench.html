.modal .row{display:flex;gap:10px;justify-content:center;margin-top:18px}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1b2a41;font-weight:700}
.lightbox{position:fixed;inset:0;background:rgba(8,14,24,.9);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:94vh;border-radius:6px;box-shadow:0 10px 50px rgba(0,0,0,.5)}
@media (max-width:600px){
  body{padding:14px 12px 50px;font-size:14px}
  h1{font-size:20px}
  header{gap:4px 10px}
  nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:none;white-space:nowrap;padding:7px 14px;min-height:40px;font-size:13px}
  .pf{grid-template-columns:1fr}
  .barrow{grid-template-columns:74px 1fr 26px;gap:6px;font-size:12px}
  .qno{font-size:11px}
  .cards{grid-template-columns:1fr;gap:10px}
  .grid{grid-template-columns:1fr}
  .card{padding:12px}
  .stat .num{font-size:26px}
  .dhead{padding:12px}
  .dhead h2{font-size:17px;min-width:120px}
  .dbody{padding:12px}
  .gq{font-size:17px}
  .opt{padding:11px 13px;font-size:14px}
  .modal .box{padding:22px 18px}
  .rankrow{font-size:12px}
  .sh{font-size:15px}
  .filters{padding:8px;gap:6px 10px}
  .filters select{min-height:40px;font-size:14px;max-width:calc(50vw - 24px)}
  .papershots{grid-template-columns:repeat(2,1fr)}
  .papershot{height:150px}
  .hallgrid,.hallgrid2{grid-template-columns:1fr}
  .hallcard .num{font-size:28px}
  .hallmini{padding:11px 12px;flex-wrap:wrap;gap:2px}
  .hallmini span{font-size:11px;width:100%;text-align:left}
  .cardacts{flex-wrap:wrap;justify-content:flex-end}
}
</style>
</head>
<body>
<div class="wrap">
<header><h1 id="title">数学错题工作台</h1><span class="built" id="built"></span><button class="backupbtn" data-backup>💾 备份认领</button></header>
<div id="subbar"></div>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script id="payload" type="application/json">__WORKBENCH_PAYLOAD__</script>
<div class="lightbox" id="lightbox"><img id="lbimg" alt=""></div>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<script>
(function(){
  const raw = JSON.parse(document.getElementById('payload').textContent);
  const subjects = raw.subjects || null;
  const subjectOrder = subjects ? Object.keys(subjects) : null;
  let curSub = '';
  let data, notes, images, quiz;
  let byKey = {};
  let state = {tab:'总览',note:null,stack:[],grp:'',sub:''};
  const cardFilter = {grade:'',unit:''};
  const viewFilter = {grade:'',unit:''};
  let gstate = null;
  let drillRef = null;
  const nav = document.getElementById('nav');
  const subbar = document.getElementById('subbar');
  function mount(d, keepTab){
    data = d;
    notes = data.notes; images = data.images || {}; quiz = data.quiz || [];
    byKey = {}; notes.forEach(n => byKey[n.key] = n);
    document.getElementById('title').textContent = subjects ? ((data.profile&&data.profile.child?data.profile.child+'的':'')+'错题工作台') : data.title;
    const pf=data.profile||{};
    const pfs=[pf.child,pf.grade,pf.textbook].filter(Boolean).join(' · ');
    document.getElementById('built').textContent = ((subjects?curSub+(pfs?' · ':''):'') + (pfs?pfs+' · ':'')) + '生成于 ' + data.builtAt.replace('T',' ');
    cardFilter.grade='';cardFilter.unit='';viewFilter.grade='';viewFilter.unit='';
    gstate=null;drillRef=null;
    state.note=null;state.stack=[];state.grp='';
    if(!keepTab || !tabs.some(t=>t[0]===keepTab)) state.tab='总览';
    render();
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const kinds = k => notes.filter(n => n.kind === k);
  const byDate = (a,b) => (b.meta.date||b.meta.updated||'').localeCompare(a.meta.date||a.meta.updated||'');
  const imgSrc = t => images[t] || t;
  const LS_K={claims:'mww_claims_v1',claimnote:'mww_claimnote_v1',prog:'mww_prog_v1',streak:'mww_streak_v1'};
  const memStore={}; // 预览面板等禁 localStorage 的环境里兜底，保证当前会话能点能高亮
  // 认领数据种子来自档案文件（由生成脚本注入），迭代工作台不会丢；localStorage 里有则以本地为准
  const seed = raw.claimSeed || {};
  if(seed.claims && typeof seed.claims==='object') memStore[LS_K.claims]=seed.claims;
  if(seed.claimnote && typeof seed.claimnote==='object') memStore[LS_K.claimnote]=seed.claimnote;
  const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v)}catch(e){} return memStore[k]!=null?memStore[k]:d};
  const lsSet=(k,v)=>{memStore[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  const scKey=k=>(subjects&&curSub?curSub:'单')+'|'+k;
  const claimOf=k=>{const v=lsGet(LS_K.claims,{})[scKey(k)];return typeof v==='number'?v:-1};
  const setClaim=(k,i)=>{const o=lsGet(LS_K.claims,{});const sk=scKey(k);if(o[sk]===i)delete o[sk];else o[sk]=i;lsSet(LS_K.claims,o)};
  const claimNoteOf=k=>{const v=lsGet(LS_K.claimnote,{})[scKey(k)];return typeof v==='string'?v:''};
  const setClaimNote=(k,v)=>{const o=lsGet(LS_K.claimnote,{});const sk=scKey(k);if(v)o[sk]=v;else delete o[sk];lsSet(LS_K.claimnote,o)};
  const progOf=k=>{const o=lsGet(LS_K.prog,{});return o[scKey(k)]||{done:false,count:0,note:''}};
  const setProg=(k,p)=>{const o=lsGet(LS_K.prog,{});o[scKey(k)]=p;lsSet(LS_K.prog,o)};
  const CLAIM_CLS=[['知识没掌握','c-k'],['审题出偏差','c-s'],['习惯有漏洞','c-h']];
  function claimsBlock(key,claims){
    const picked=claimOf(key), extra=claimNoteOf(key);
    const hint = (picked>=0||extra)
      ? '✅ 已记下'+(extra?'你的补充':'你的认领')+'——隔天重做前再看看它。'
      : '点一个最像你当时出错的情况；上面都不像，就在下面自己写一条。认领错因不是罚站，是知道自己该补哪块。';
    return '<div class="claims">'+claims.map((c,i)=>{
      const cls=CLAIM_CLS.find(p=>c.indexOf(p[0])===0);
      return `<button class="claim ${cls?cls[1]:''} ${i===picked?'on':''}" data-claim="${esc(key)}" data-ci="${i}">${esc(c)}</button>`;
    }).join('')+`<textarea class="claim-extra" data-claimnote="${esc(key)}" rows="2" placeholder="其他原因 / 补充说明：上面没写到的，或者当时是问了别人才做对的…">${esc(extra)}</textarea>`+'<span class="c-hint">'+hint+'</span></div>';
  }

  function inline(s){
    s = esc(s);
    s = s.replace(/!\[\[([^\]|]+)(\|[^\]]*)?\]\]/g, (m,t)=>`<img src="${esc(imgSrc(t.trim()))}" alt="">`);
    s = s.replace(/\[\[([^\]|]+)(?:\|([^\]]*))?\]\]/g, (m,t,l)=>{const k=t.replace(/\.md$/,''); return byKey[k]?`<a href="#" data-note="${esc(k)}">${esc(l||byKey[k].title)}</a>`:esc(l||t);});
    s = s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function md(body){
    const lines = body.split('\n'); let out=[], i=0, list=null, table=null, tableRows=0;
    const flush=()=>{ if(list){out.push(`</${list}>`);list=null;} if(table){out.push('</table>');table=null;tableRows=0;} };
    while(i<lines.length){
      const l=lines[i];
      if(/^\s*$/.test(l)){flush();i++;continue;}
      let m;
      if((m=l.match(/^(#{1,4})\s+(.*)/))){flush();const h=m[1].length;out.push(`<h${h+1}>${inline(m[2])}</h${h+1}>`);i++;continue;}
      if(/^\s*\|/.test(l)){ if(!table){flush();table=true;tableRows=0;out.push('<table>');} if(/^\s*\|\s*-/.test(l)){i++;continue;} const cells=l.trim().replace(/^\||\|$/g,'').split('|'); const tag=tableRows===0?'th':'td'; out.push('<tr>'+cells.map(c=>`<${tag}>${inline(c.trim())}</${tag}>`).join('')+'</tr>'); tableRows++; i++; continue;}
      if((m=l.match(/^\s*[-*]\s+(.*)/))){ if(list!=='ul'){flush();list='ul';out.push('<ul>');} out.push(`<li>${inline(m[1])}</li>`); i++; continue;}
      if((m=l.match(/^\s*\d+[.、]\s+(.*)/))){ if(list!=='ol'){flush();list='ol';out.push('<ol>');} out.push(`<li>${inline(m[1])}</li>`); i++; continue;}
      if((m=l.match(/^>\s?(.*)/))){flush();out.push(`<blockquote>${inline(m[1])}</blockquote>`);i++;continue;}
      flush(); out.push(`<p>${inline(l)}</p>`); i++;
    }
    flush(); return out.join('\n');
  }

  const tabs = [['总览',overview],['错题卡',cards],['看板',dashboard],['闯关 ⭐',game],['对标课标',standards],['易错点',()=>listing('易错点')],['本周行动',actionPage],['卷子',()=>listing('卷子')],['练习',()=>listing('练习')]];
  tabs.forEach(([name])=>{const b=document.createElement('button');b.textContent=name;if(name.indexOf('闯关')===0)b.className='hi';b.onclick=()=>go({tab:name});nav.appendChild(b);});

  function overview(){
    const pf=data.profile||{};
    let h=`<div class="hall"><div class="hall-hi">${esc(pf.child||'孩子')} · ${esc(pf.grade||'')} · ${esc(pf.textbook||'')}</div><p class="kv">这里是入口。点数字卡按程度看核心能力，错题怎么归类的去「易错点」。</p></div>`;
    const act=kinds('易错点').filter(p=>p.meta.status==='活跃'||p.meta.status==='减少').length;
    const lvC=l=>kinds('维度').filter(d=>d.meta.level===l).length;    h+='<div class="hallgrid">'
      +`<div class="hallcard c-red" data-tab="对标课标" data-grp="需加强"><div class="num">${lvC('需加强')}</div><div class="ttl">需加强</div><div class="sub">有错题证据的能力 →</div></div>`
      +`<div class="hallcard c-amber" data-tab="对标课标" data-grp="基本掌握"><div class="num">${lvC('基本掌握')}</div><div class="ttl">基本掌握</div><div class="sub">站稳了，再核实 →</div></div>`
      +`<div class="hallcard c-green" data-tab="对标课标" data-grp="扎实"><div class="num">${lvC('扎实')}</div><div class="ttl">扎实</div><div class="sub">看已稳的能力 →</div></div>`
      +`<div class="hallcard c-soft" data-tab="对标课标" data-grp="未考察"><div class="num">${lvC('未考察')}</div><div class="ttl">未考察</div><div class="sub">还没考到的角落 →</div></div>`
      +'</div>';
    h+='<div class="hallgrid2">'
      +`<div class="hallmini" data-tab="错题卡"><b>错题卡</b><span>${kinds('错题').length} 张 · 按年级单元筛 →</span></div>`
      +`<div class="hallmini" data-tab="易错点"><b>易错点</b><span>${act} 个活跃的坑 · 归并去重 →</span></div>`
      +`<div class="hallmini" data-tab="本周行动"><b>本周行动</b><span>${kinds('行动').length} 条 · 一坑一打卡 →</span></div>`
      +`<div class="hallmini" data-tab="闯关 ⭐"><b>闯关 ⭐</b><span>连对3题通关 →</span></div>`
      +`<div class="hallmini" data-tab="看板"><b>看板</b><span>错因分布 · 排行榜 →</span></div>`
      +`<div class="hallmini" data-tab="卷子"><b>卷子</b><span>原卷照片按单元 →</span></div>`
      +'</div>';
    const todo=kinds('练习').filter(p=>p.meta.status==='待作答');
    h+='<h2>待作答练习</h2>'+(todo.length?`<div class="card list">${todo.map(linkRow).join('')}</div>`:'<p class="empty">没有待作答的练习。</p>');
    return h;
  }
  function dimCard(n, cls, extra){
    const ev=n.body.split('\n').filter(x=>x.trim()&&!/^#/.test(x)).map(x=>x.replace(/^\s*[-*]\s+/,'')).slice(0,2).join(' ');
    return `<div class="card dim ${cls}" data-note="${esc(n.key)}" role="link" tabindex="0"><div class="head"><h3>${esc(n.meta.name||n.meta.dimension||n.title)}</h3>${extra}</div><div class="ev">${inline(ev)}</div></div>`;
  }
  function standards(){
    const dims=kinds('维度');
    const CANON=['会用数学的眼光观察现实世界','会用数学的语言表达现实世界','会用数学的思维思考现实世界','学习习惯'];
    const LVS=['扎实','基本掌握','需加强','未考察'];
    const seen=[]; dims.forEach(d=>{const g=d.meta.group||'未分组'; if(!seen.includes(g)) seen.push(g);});
    const groups=[...CANON.filter(g=>seen.includes(g)), ...seen.filter(g=>!CANON.includes(g))];
    const lv=LVS.includes(state.grp)?state.grp:'';
    let h='<h2>课标维度 · 掌握程度</h2>';
    if(!groups.length) return h+'<p class="empty">还没有课标维度记录。</p>';
    h+='<p class="kv">'+(lv?('只看「'+lv+'」的项——点总览的方块跳过来的，看完去别的程度就再点一次总览卡片。'):'拿 2022 课标这把尺子量孩子：核心能力全部摆在这里——需加强是有错题证据的，未考察是这几套材料还没考到的，不是不会。点卡片看课标定义和证据。错题归并出来的坑在「易错点」页。')+'</p>';
    groups.forEach(g=>{
      const items=dims.filter(d=>(d.meta.group||'未分组')===g&&(!lv||d.meta.level===lv));
      if(lv&&!items.length) return;
      h+=`<section class="stdsec"><h3 class="sh">${esc(g)} <span class="kv">${items.length} 项</span></h3>`
        +(items.length?`<div class="grid">${items.map(d=>dimCard(d,'l-'+esc(d.meta.level||'未考察'),`<span class="lv">${esc(d.meta.level||'未考察')}</span>`)).join('')}</div>`:'<p class="empty">还没有记录。</p>')+'</section>';
    });
    return h;
  }
  function actionPage(){
    const items=kinds('行动');
    let h='<h2>本周行动 · 一条绑一个坑</h2>';
    if(!items.length) return h+'<p class="empty">还没有行动安排。在对话里说「出本周行动」，AI 会按坑排几条，每天碰一下就行。</p>';
    const done=items.filter(n=>progOf(n.key).done).length;
    h+='<div class="actprog"><i style="width:'+(items.length?Math.round(done/items.length*100):0)+'%"></i></div>'
      +`<p class="kv">完成 ${done}/${items.length} · 打卡次数和备注记在这台电脑的浏览器里</p>`;
    h+=items.map(n=>{
      const m=n.meta, p=progOf(n.key);
      const pfs=String(m.targets||'').split(/[,，、]\s*/).filter(Boolean).map(x=>`<span class="chip pf">${esc(pfNameOf(x))}</span>`).join('');
      const stars='⭐'.repeat(Math.max(1,Math.min(3,+m.difficulty||1)));
      const first=(n.body.split('\n').find(y=>y.trim()&&!/^#/.test(y.trim()))||'').trim();
      return `<div class="actrow ${p.done?'done':''}"><div class="acthead"><button class="actcheck ${p.done?'on':''}" data-act="${esc(n.key)}" data-actdo="1" aria-label="标记完成">${p.done?'✓':''}</button><div style="flex:1;min-width:0"><div class="atitle" style="font-weight:700">${esc(n.title)}</div><div class="kv">${stars} ${esc(m.date||'')} ${pfs}</div><div class="ev">${inline(first)}</div></div><div class="actcount"><button data-act="${esc(n.key)}" data-actdo="dec" aria-label="减一次">−</button><b>${p.count}</b>次<button data-act="${esc(n.key)}" data-actdo="inc" aria-label="加一次">＋</button></div></div><input class="actnote" data-act="${esc(n.key)}" data-actdo="note" value="${esc(p.note||'')}" placeholder="备注：今天错在哪、明天留心什么"></div>`;
    }).join('');
    const st=lsGet(LS_K.streak,{last:'',days:0});
    const today=todayStr();
    h+=`<div class="streak"><div>不用猛刷，每天碰一下就行——已坚持 <b style="font-size:22px;color:var(--gold)">${st.days||0}</b> 天</div><button class="streakbtn" data-actdo="streak">${st.last===today?'今天碰过了 ✓':'今天碰过了吗？点一下'}</button></div>`;
    const pf=kinds('易错点').filter(x=>x.meta.status==='活跃'||x.meta.status==='减少');
    if(pf.length){
      h+='<h2>考前速览 · 每个坑一句话</h2><div class="card list">'+pf.sort((a,b)=>(b.meta.last_seen||'').localeCompare(a.meta.last_seen||'')).map(x=>{
        const line=(x.body.split('\n').find(y=>y.trim()&&!/^#/.test(y.trim()))||'').trim().slice(0,80);
        return `<a href="#" data-note="${esc(x.key)}">${esc(x.meta.name||x.title)}<small>${esc(line)}</small></a>`;
      }).join('')+'</div>';
    }
    return h;
  }
  function linkRow(n){ const m=n.meta; const extra=[m.date||m.updated,m.grade,m.unit,m.status].filter(Boolean).join(' · '); return `<a href="#" data-note="${esc(n.key)}">${esc(n.title)}<small>${esc(extra)}</small></a>`; }
  function unitOfImage(t){
    const s=String(t);
    if(/期中/.test(s)) return '期中';
    const m=s.match(/([一二三四五六七八\d]+)单元/);
    if(m){ let v=m[1]; const map={'1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八'}; v=map[v]||v; return '第'+v+'单元'; }
    return '其他';
  }
  function filterBar(items){
    const grades=[...new Set(items.map(n=>n.meta.grade).filter(Boolean))];
    const gu={}; items.forEach(n=>{ const g=n.meta.grade||'未标年级',u=n.meta.unit||'未标单元';(gu[g]=gu[g]||new Set()).add(u); });
    let f='<div class="filters"><span class="kv">筛选</span>';
    f+='<label>年级 <select data-vfilter="grade"><option value="">全部年级</option>'+grades.map(g=>`<option value="${esc(g)}"${viewFilter.grade===g?' selected':''}>${esc(g)}</option>`).join('')+'</select></label>';
    f+='<label>单元 <select data-vfilter="unit"><option value="">全部单元</option>'+Object.keys(gu).map(g=>`<optgroup label="${esc(g)}">`+[...gu[g]].sort().map(u=>`<option value="${esc(u)}"${viewFilter.unit===u?' selected':''}>${esc(u)}</option>`).join('')+'</optgroup>').join('')+'</select></label>';
    return f+'</div>';
  }
  function matchFilter(n){ return (!viewFilter.grade||n.meta.grade===viewFilter.grade)&&(!viewFilter.unit||n.meta.unit===viewFilter.unit); }
  function paperGallery(){
    const entries=Object.keys(images).filter(t=>/\.(jpg|jpeg|png|webp)/i.test(t));
    const allNotes=kinds('卷子');
    const groups={};
    entries.forEach(t=>{ const u=unitOfImage(t); (groups[u]=groups[u]||[]).push(t); });
    const order=['期中','第一单元','第二单元','第三单元','第四单元','第五单元','第六单元','第七单元','第八单元','其他'];
    let h='<h2>卷子 · 原卷照片</h2><p class="kv">按年级 + 单元分组，点图片放大看清晰原卷。原卷只放这里，错题卡上不重复。</p>';
    h+=filterBar(allNotes.length?allNotes:[{meta:{grade:''}}]);
    const keys=Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
    if(!keys.length) return h+'<p class="empty">还没有上传原卷照片。用 media 命令把试卷照片存进附件。</p>';
    const grade=viewFilter.grade||'';
    keys.forEach(u=>{
      if(viewFilter.unit && u!==viewFilter.unit) return;
      h+=`<h3>${esc(grade?grade+' · ':'')}${esc(u)} <span class="kv">${groups[u].length} 张</span></h3><div class="papershots">`;
      groups[u].sort().forEach(t=>{ const nm=t.split('/').pop(); h+=`<figure class="paperfig"><img class="papershot zoom" src="${esc(imgSrc(t))}" alt="${esc(nm)}" data-zoom="1"><figcaption>${esc(nm)}</figcaption></figure>`; });
      h+='</div>';
    });
    const papers=allNotes.filter(matchFilter).sort(byDate);
    if(papers.length) h+='<h3>卷子分析笔记</h3><div class="card list">'+papers.map(linkRow).join('')+'</div>';
    return h;
  }
  function listing(kind){
    if(kind==='卷子') return paperGallery();
    const items=kinds(kind).sort(byDate);
    let h=`<h2>${kind}</h2>`;
    if(kind==='易错点'&&items.length){
      h+='<p class="kv">错题归并出来的坑：10 道错题翻来覆去就这几个坑。一张坑一张卡牌，难度用星星标，点开看原题和出现记录。坑填得差不多了，对应的课标维度程度就会往上走。</p>';
      const cnt=p=>kinds('错题').filter(n=>String(n.meta.pitfalls||'').split(/[,，、]\s*/).map(x=>x.trim()).includes(p.meta.id||p.title)).length;
      return h+'<div class="grid">'+items.map(p=>{
        const d=+p.meta.difficulty||0;
        const stars=d?'<span class="star">'+'⭐'.repeat(d)+'</span>':'';
        const line=(p.body.split('\n').find(y=>y.trim()&&!/^#/.test(y.trim()))||'').trim().slice(0,70);
        return `<div class="card dim l-需巩固" data-note="${esc(p.key)}" role="link" tabindex="0"><div class="head"><h3>${esc(p.meta.name||p.title)}</h3>${stars}</div><div class="ev">${inline(line)}</div><div class="kv" style="margin-top:6px">${cnt(p)} 道题 · <span class="tag s-${esc(p.meta.status)}">${esc(p.meta.status)}</span></div></div>`;
      }).join('')+'</div>';
    }
    if(kind==='练习'&&items.length){
      h+=filterBar(items);
      const shown=items.filter(matchFilter);
      h+=shown.length?`<div class="card list">${shown.map(linkRow).join('')}</div>`:'<p class="empty">这个筛选条件下没有练习。</p>';
      h+='<p class="kv">做完的练习也留在这里当题型库，下个单元考或期末复习时可以调出来参考出题。</p>';
      return h;
    }
    return h+(items.length?`<div class="card list">${items.map(linkRow).join('')}</div>`:'<p class="empty">还没有记录。</p>');
  }
  const META_LABEL={id:'编号',name:'名称',subject:'学科',grade:'年级',unit:'单元',date:'日期',updated:'更新',status:'状态',dimension:'维度',cause:'错因',tier:'层级',pitfalls:'易错点',paper:'卷子',first_seen:'首见',last_seen:'最近',source:'课标依据',task_group:'任务群',level:'程度',group:'组别',image:'原图',skill:'技能'};
  function dchips(n, keys){
    return (keys||Object.keys(n.meta)).filter(k=>n.meta[k]!==undefined&&n.meta[k]!=='').map(k=>`<span class="chip">${esc(META_LABEL[k]||k)} · ${esc(n.meta[k])}</span>`).join('');
  }
  function detailWrong(n){
    const m=n.meta;
    const pfTags=(m.pitfalls||'').split(/[,，、]\s*/).filter(Boolean).map(x=>`<span class="chip pf">${esc(pfNameOf(x))}</span>`).join('');
    let h='<div class="detail">';
    h+=`<div class="dhead"><span class="qno">${esc(m.id||'CT')}</span><h2>${esc(n.title)}</h2></div>`;
    h+=`<div class="dtags"><span class="chip grade">${esc(m.grade||'')}</span><span class="chip unit">${esc(m.unit||'未标单元')}</span>${dchips(n,['cause','date','status'])}${pfTags}</div>`;
    h+='<div class="dans">';
    if(m.q) h+=`<div class="dstem">${esc(m.q)}</div>`;
    if(m.wrong) h+=`<div class="ansline wrong"><span class="lab">错答</span><span class="txt">${esc(m.wrong)}</span></div>`;
    if(m.right) h+=`<div class="ansline right"><span class="lab">正答</span><span class="txt">${esc(m.right)}</span></div>`;
    if(m.note) h+=`<div class="ansline pit"><span class="lab">易错点</span><span class="txt">${esc(m.note)}</span></div>`;
    const claims=String(m.claims||'').split('|').filter(Boolean);
    if(claims.length) h+=claimsBlock(n.key,claims);
    h+='</div>';
    // 完整分析只保留错题卡没有的：反思条、老师批改、下一步。跳过重复的「原题与孩子的答案」「正确写法」
    const secs=n.body.split(/^## /m).slice(1);
    const keep=secs.filter(s=>/反思条|老师红笔|下一步/.test(s)).map(s=>'## '+s);
    if(keep.length){
      h+=`<details class="dfull"><summary>孩子的反思 · 错因 · 下一步</summary><div class="dbody">${md(keep.join('\n'))}</div></details>`;
    }
    h+='</div>';
    return h;
  }
  function detailPf(n){
    const m=n.meta;
    let h='<div class="detail">';
    h+=`<div class="dhead"><span class="qno pf">${esc(m.id||'PF')}</span><h2>${esc(m.name||n.title)}</h2><span class="tag s-${esc(m.status)}">${esc(m.status)}</span></div>`;
    h+=`<div class="dtags">${dchips(n,['dimension','cause','tier','first_seen','last_seen'])}</div>`;
    h+=`<div class="dbody">${md(n.body)}</div>`;
    return h+'</div>';
  }
  function detailGeneric(n){
    const skip=new Set(['schema','kind','key']);
    const keys=Object.keys(n.meta).filter(k=>!skip.has(k));
    let h='<div class="detail">';
    h+=`<div class="dhead"><h2>${esc(n.title)}</h2></div>`;
    h+=`<div class="dtags">${dchips(n,keys)}</div>`;
    h+=`<div class="dbody">${md(n.body)}</div>`;
    return h+'</div>';
  }
  function noteView(key){
    const n=byKey[key]; if(!n) return '<p class="empty">没有这条笔记。</p>';
    let h='<span class="back" data-back="1">← 返回</span>';
    if(n.kind==='错题') h+=detailWrong(n);
    else if(n.kind==='易错点') h+=detailPf(n);
    else h+=detailGeneric(n);
    return h;
  }

  function findPhoto(n){
    if(n.meta.image) return n.meta.image;
    const m = n.body.match(/!\[\[([^\]|]+)/);
    if(m && /\.(jpg|jpeg|png|webp)/i.test(m[1])) return m[1].trim();
    if(n.meta.paper){
      const paper = notes.find(x=>x.meta.id===n.meta.paper);
      if(paper){ const pm = paper.body.match(/!\[\[([^\]|]+)/); if(pm && /\.(jpg|jpeg|png|webp)/i.test(pm[1])) return pm[1].trim(); }
    }
    const anyPaper = kinds('卷子')[0];
    if(anyPaper){ const pm = anyPaper.body.match(/!\[\[([^\]|]+)/); if(pm && /\.(jpg|jpeg|png|webp)/i.test(pm[1])) return pm[1].trim(); }
    return null;
  }
  function pfNameOf(id){ const p=notes.find(x=>x.meta.id===id||x.meta.name===id); return p?p.meta.name:id; }
  function cards(){
    const items = kinds('错题').sort(byDate);
    if(!items.length) return '<h2>错题卡 · 错在哪一眼看清</h2><p class="empty">还没有错题笔记。整理卷子后，这里会变成一张张卡片。</p>';
    const grades=[...new Set(items.map(n=>n.meta.grade).filter(Boolean))];
    const gradeUnits={};
    items.forEach(n=>{ const g=n.meta.grade||'未标年级', u=n.meta.unit||'未标单元'; (gradeUnits[g]=gradeUnits[g]||new Set()).add(u); });
    let f='<div class="filters"><span class="kv">筛选</span>';
    f+='<label>年级 <select data-filter="grade"><option value="">全部年级</option>'+grades.map(g=>`<option value="${esc(g)}"${cardFilter.grade===g?' selected':''}>${esc(g)}</option>`).join('')+'</select></label>';
    f+='<label>单元 <select data-filter="unit"><option value="">全部单元</option>'+Object.keys(gradeUnits).map(g=>`<optgroup label="${esc(g)}">`+[...gradeUnits[g]].sort().map(u=>`<option value="${esc(u)}"${cardFilter.unit===u?' selected':''}>${esc(u)}</option>`).join('')+'</optgroup>').join('')+'</select></label>';
    f+='</div>';
    const shown=items.filter(n=>(!cardFilter.grade||n.meta.grade===cardFilter.grade)&&(!cardFilter.unit||n.meta.unit===cardFilter.unit));
    let h = '<h2>错题卡 · 错在哪一眼看清</h2><p class="kv">错答红删除线、正答绿色；红字是错答内容，不是分数。原卷照片在「卷子」页按单元查看。</p>'+f+`<p class="kv">共 ${shown.length} 张卡</p><div class="cards">`;
    shown.forEach(n=>{
      const m=n.meta;
      const q = m.q || n.title || '题目';
      const pfTags = (m.pitfalls||'').split(/[,，、]\s*/).filter(Boolean).map(x=>`<span class="chip pf">${esc(pfNameOf(x))}</span>`).join('');
      const cause = m.cause?`<span class="chip">${esc(m.cause)}</span>`:'';
      const tags=`<span class="chip grade">${esc(m.grade||'')}</span><span class="chip unit">${esc(m.unit||'未标单元')}</span>`;
      const wrong = m.wrong?`<div class="ansline wrong"><span class="lab">错答</span><span class="txt">${esc(m.wrong)}</span></div>`:'';
      const right = m.right?`<div class="ansline right"><span class="lab">正答</span><span class="txt">${esc(m.right)}</span></div>`:'';
      const pit = m.note?`<div class="ansline pit"><span class="lab">易错点</span><span class="txt">${esc(m.note)}</span></div>`:'';
      const claims=String(m.claims||'').split('|').filter(Boolean);
      const qref=quiz.some(z=>z.ref===m.id)?`<button class="drillbtn" data-drill="${esc(m.id)}">练这题 ▶</button>`:'';
      h += `<div class="qcard"><div class="qhead"><span class="qno">${esc(m.id||'CT')}</span>${tags}${cause}${pfTags}</div><div class="qbody"><div class="stem">${esc(q)}</div>${wrong}${right}${pit}${claims.length?claimsBlock(n.key,claims):''}</div><div class="qfoot"><span>${esc(m.date||'')}</span><span class="cardacts">${qref}<a href="#" data-note="${esc(n.key)}">完整分析 →</a></span></div></div>`;
    });
    return h+'</div>'+(shown.length?'':'<p class="empty">这个筛选条件下没有错题。</p>');
  }

  function dashboard(){
    const wrongs = kinds('错题'), pf = kinds('易错点'), papers = kinds('卷子');
    const causeCount = {}, pfCount = {};
    wrongs.forEach(n=>{ const c=(n.meta.cause||'未分类').split('·')[0]; causeCount[c]=(causeCount[c]||0)+1; });
    wrongs.forEach(n=>{ (n.meta.pitfalls||'').split(/[,，、]\s*/).filter(Boolean).forEach(x=>{ pfCount[x]=(pfCount[x]||0)+1; }); });
    const causes = Object.entries(causeCount).sort((a,b)=>b[1]-a[1]);
    const maxC = causes.length?causes[0][1]:1;
    const kps = new Set(wrongs.map(n=>n.meta.cause).filter(Boolean)).size;
    const active = pf.filter(p=>p.meta.status==='活跃'||p.meta.status==='减少');
    let h = '<h2>看板 · 用数据看清弱在哪</h2><div class="stats">'
      + `<div class="card stat"><div class="num" style="color:var(--red)">${wrongs.length}</div><div class="lbl">错题总数</div></div>`
      + `<div class="card stat"><div class="num" style="color:var(--amber)">${kps}</div><div class="lbl">涉及知识点</div></div>`
      + `<div class="card stat"><div class="num" style="color:var(--green)">${active.length}</div><div class="lbl">活跃易错点</div></div>`
      + `<div class="card stat"><div class="num">${papers.length}</div><div class="lbl">已录卷子</div></div></div>`;
    if(causes.length){
      h += '<h3>错因分布</h3><div class="card"><div class="bars">';
      causes.forEach(([nm,ct])=>{ h += `<div class="barrow"><span class="nm" title="${esc(nm)}">${esc(nm)}</span><span class="bartrack"><span class="barfill" style="width:${Math.round(ct/maxC*100)}%"></span></span><span class="ct">${ct}</span></div>`; });
      h += '</div></div>';
    }
    const rank = Object.entries(pfCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if(rank.length){
      const mx=rank[0][1];
      h += '<h3>易错点排行榜</h3><div class="rank">';
      rank.forEach(([nm,ct],i)=>{ h += `<div class="rankrow"><span class="rankno">${i+1}</span><span style="flex:0 0 140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pfNameOf(nm))}</span><span class="rankbar"><i style="width:${Math.round(ct/mx*100)}%"></i></span><span class="kv">${ct}</span></div>`; });
      h += '</div>';
    }
    h += '<h3>错题时间线</h3>' + (wrongs.length?`<div class="card"><div class="timeline">${wrongs.slice(0,20).map(n=>`<div class="tlitem"><span class="d">${esc(n.meta.date||'')}</span><a href="#" data-note="${esc(n.key)}" style="color:inherit;text-decoration:none">${esc(n.title)}</a> <span class="kv">· ${esc(n.meta.cause||'')}</span></div>`).join('')}</div></div>`:'<p class="empty">还没有错题。</p>');
    h += '<h3>一句话诊断</h3><div class="ai-diag">'+aiDiagnosis(causes,active,wrongs)+'</div>';
    return h;
  }
  function aiDiagnosis(causes,active,wrongs){
    if(!wrongs.length) return '还没有错题数据。整理卷子后，这里会给出一句"最该先补什么"的诊断。';
    const top=causes[0];
    const topActive=active.slice(0,2).map(p=>p.meta.name).join('、');
    let s = top ? `「${esc(top[0])}」类错误最多（${top[1]}处），是最主要的失分区域。` : '错因较分散。';
    if(topActive) s += ` 建议先抓 ${esc(topActive)} 这两条主线。`;
    s += ' 数据来自口述确认的错题，不写分数，只看错在哪。';
    return s;
  }

  function game(){
    if(!quiz.length) return '<h2>闯关 · 连对3题通关</h2><div class="card"><p class="empty">题库还没建。整理错题后，在档案里建「闯关题库.md」，这里就能开玩。<br>题目全部从真实错题长出来，不编新场景。</p></div>';
    if(drillRef){
      const qs=quiz.filter(q=>q.ref===drillRef);
      const title=byKey[Object.keys(byKey).find(k=>byKey[k].meta.id===drillRef)]?.title||drillRef;
      return `<h2>练这题 · ${esc(title)}</h2><div class="gamewrap"><p class="kv">本题共有 ${qs.length} 道变式，答错会展开错因提醒，可反复练。${qs.length<2?'（题库暂只配了1道，想加变式告诉我）':''}<button class="linkbtn" data-alldril="1">← 回综合闯关</button></p><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div id="gqzone"></div><div class="why" id="gwhy"><div class="wt">为什么错</div><div class="wb" id="gwhyb"></div></div><div class="gmeta" id="gmeta"></div></div>`;
    }
    const skills = {};
    quiz.forEach(q=>{ const k=q.skill||'综合'; (skills[k]=skills[k]||[]).push(q); });
    let h = '<h2>闯关 · 连对3题通关</h2><div class="gamewrap"><p class="kv">挑一个方块开打（按课标易错点综合归类）。每题4选1，连对3题通关；答错清零重来。题目会反复抽，练多少次都行，不会"做完就没"。错题卡上的「练这题」可以只练单道。</p><div class="skillpick">';
    Object.keys(skills).forEach((k,i)=>{ const stars='⭐'.repeat(Math.min(3,(skills[k][0]&&skills[k][0].level)||1)); h += `<button class="skillbtn${i===0?' on':''}" data-skill="${esc(k)}">${esc(k)}<br><span class="stars">${stars}</span></button>`; });
    h += '</div><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div id="gqzone"><p class="empty">点上面的方块，开始闯关 →</p></div><div class="why" id="gwhy"><div class="wt">为什么错</div><div class="wb" id="gwhyb"></div></div><div class="gmeta" id="gmeta"></div></div>';
    return h;
  }
  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function startGame(skill){
    const pool = drillRef ? shuffle(quiz.filter(q=>q.ref===drillRef)) : shuffle(quiz.filter(q=>(q.skill||'综合')===skill));
    gstate = {pool:pool, i:0, streak:0, total:0, correct:0, skill:skill, locked:false};
    document.querySelectorAll('.skillbtn').forEach(b=>b.classList.toggle('on',b.dataset.skill===skill));
    document.getElementById('gwhy').classList.remove('show');
    renderQuestion();
  }
  function renderQuestion(){
    if(!gstate) return;
    const s=gstate;
    if(s.streak>=3){ showPass(); return; }
    if(s.i>=s.pool.length){
      if(drillRef){ s.i=0; }
      else { s.pool=shuffle(s.pool); s.i=0; s.round=(s.round||1)+1; s.msg='这一轮把题都过完了，但还没连对3题——不算通关哦，换个顺序再来！'; }
    }
    const q=s.pool[s.i];
    const opts=shuffle(q.opts.map((text,idx)=>({text:text,ok:idx===q.a})));
    const zone=document.getElementById('gqzone');
    const tipHtml=q.tip?`<details class="tipbox"><summary>📖 ${esc(q.tipTitle||'小抄 · 点开看判断方法')}</summary><div class="tipbody">${esc(q.tip)}</div></details>`:'';
    zone.innerHTML = `<div class="gq">${esc(q.q)}</div>${tipHtml}<div class="opts">${opts.map((o,i)=>`<button class="opt" data-ok="${o.ok?1:0}" data-i="${i}">${String.fromCharCode(65+i)}. ${esc(o.text)}</button>`).join('')}</div>`;
    if(s.msg){ zone.insertAdjacentHTML('afterbegin', `<div class="roundmsg">${esc(s.msg)}</div>`); s.msg=''; }
    s.locked=false;
    document.getElementById('gmeta').textContent=(s.round>1?`第${s.round}轮 · `:'')+`第 ${s.i+1} / ${s.pool.length} 题 · 已连对 ${s.streak}/3`;
    paintDots();
  }
  function paintDots(){ document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('lit', i<(gstate?gstate.streak:0))); }
  function answer(btn){
    if(!gstate||gstate.locked) return;
    const s=gstate, ok=btn.dataset.ok==='1';
    s.locked=true; s.total++;
    document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    if(ok){ btn.classList.add('correct'); s.correct++; s.streak++; }
    else { btn.classList.add('wrong'); s.streak=0; const right=document.querySelector('.opt[data-ok="1"]'); if(right) right.classList.add('correct');
      const why=document.getElementById('gwhy'); document.getElementById('gwhyb').textContent=(s.pool[s.i].why||'再想想这一步。'); why.classList.add('show');
    }
    paintDots();
    document.getElementById('gmeta').textContent=(s.round>1?`第${s.round}轮 · `:'')+`第 ${s.i+1} / ${s.pool.length} 题 · 已连对 ${s.streak}/3 · 答对 ${s.correct}/${s.total}`;
    setTimeout(()=>{ s.i++; renderQuestion(); }, ok?700:1900);
  }
  function showPass(){
    const s=gstate, rate=s.total?Math.round(s.correct/s.total*100):100;
    document.getElementById('gqzone').innerHTML=`<div style="padding:24px 0"><div class="big">🎉 通关</div><p>「${esc(s.skill)}」连对3题！共做 ${s.total} 题，正确率 ${rate}%</p></div>`;
    document.getElementById('gwhy').classList.remove('show');
    document.getElementById('modalbox').innerHTML=`<h2>通关啦</h2><div class="big">${rate}%</div><p>共 ${s.total} 题，答对 ${s.correct} 题<br>「${esc(s.skill)}」连对3题通关</p><div class="row"><button class="btn" id="magain">再练一组</button><button class="btn primary" id="mclose">收下</button></div>`;
    document.getElementById('modal').classList.add('show');
    document.getElementById('magain').onclick=()=>{ document.getElementById('modal').classList.remove('show'); startGame(s.skill); };
    document.getElementById('mclose').onclick=()=>{ document.getElementById('modal').classList.remove('show'); go({tab:'闯关 ⭐'}); };
  }

  function go(next){ if(next.note){ state.stack.push({tab:state.tab,note:state.note}); state.note=next.note; } else { state.tab=next.tab||'总览'; state.grp=next.grp||''; state.note=null; state.stack=[]; } try{ const h=(subjects&&curSub?'sub='+encodeURIComponent(curSub)+'&':'')+(state.note?'note='+encodeURIComponent(state.note):'tab='+encodeURIComponent(state.tab)+(state.grp?'&grp='+encodeURIComponent(state.grp):'')); history.replaceState(null,'','#'+h); }catch(e){} render(); }
  function back(){ const prev=state.stack.pop(); if(prev){ state.tab=prev.tab; state.note=prev.note; } else { state.note=null; } render(); }
  // 认领按钮只做局部更新：不重绘整页，避免 11MB 页面卡顿 + 输入框内容丢失
  function refreshClaimHint(box,key){
    if(!box) return;
    const picked=claimOf(key), extra=claimNoteOf(key), hint=box.querySelector('.c-hint');
    box.querySelectorAll('.claim').forEach(b=>b.classList.toggle('on',+b.dataset.ci===picked));
    if(hint) hint.textContent=(picked>=0||extra)
      ? '✅ 已记下'+(extra?'你的补充':'你的认领')+'——隔天重做前再看看它。'
      : '点一个最像你当时出错的情况；上面都不像，就在下面自己写一条。认领错因不是罚站，是知道自己该补哪块。';
  }
  // 备份：把认领数据导出成 JSON，既支持下载，也在弹窗里给出可复制文本（预览面板下载可能被拦）
  function exportClaims(){
    const payload={format:'mww-claims-v1',exportedAt:new Date().toISOString(),
      claims:lsGet(LS_K.claims,{}), claimnote:lsGet(LS_K.claimnote,{})};
    const text=JSON.stringify(payload,null,2);
    const box=document.getElementById('modalbox');
    box.innerHTML='<h2>认领备份</h2><p style="font-size:13px;color:var(--soft)">复制下面全部内容发给小8，或点下载保存。以后重建会自动带回去，不会丢。</p>'
      +'<textarea class="bkbox" id="bktext" readonly>'+esc(text)+'</textarea>'
      +'<div class="row"><button class="btn" id="bkcopy">复制全部</button><button class="btn primary" id="bkdl">下载文件</button><button class="btn" id="bkclose">关闭</button></div>';
    document.getElementById('modal').classList.add('show');
    const ta=document.getElementById('bktext');
    document.getElementById('bkcopy').onclick=()=>{ ta.select(); try{document.execCommand('copy'); document.getElementById('bkcopy').textContent='已复制 ✓'}catch(e){document.getElementById('bkcopy').textContent='请手动全选复制'} };
    document.getElementById('bkdl').onclick=()=>{
      try{ const blob=new Blob([text],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=url; a.download='米娅认领记录.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        document.getElementById('bkdl').textContent='已下载 ✓';
      }catch(e){ document.getElementById('bkdl').textContent='下载被拦，请复制'; }
    };
    document.getElementById('bkclose').onclick=()=>document.getElementById('modal').classList.remove('show');
  }
  function pickClaim(btn){
    const key=btn.dataset.claim;
    setClaim(key,+btn.dataset.ci);
    document.querySelectorAll('.claims').forEach(box=>{
      const t=box.querySelector('[data-claimnote]');
      if(t&&t.dataset.claimnote===key) refreshClaimHint(box,key);
    });
  }
  document.addEventListener('click', e=>{
    const zoom=e.target.closest('[data-zoom]'); if(zoom){ document.getElementById('lbimg').src=zoom.src; document.getElementById('lightbox').classList.add('show'); return; }
    if(e.target.closest('#lightbox')){ document.getElementById('lightbox').classList.remove('show'); return; }
    const opt=e.target.closest('.opt'); if(opt){ answer(opt); return; }
    const dz=e.target.closest('[data-drill]'); if(dz){ drillRef=dz.dataset.drill; go({tab:'闯关 ⭐'}); startGame(drillRef); return; }
    const da=e.target.closest('[data-alldril]'); if(da){ drillRef=null; render(); return; }
    const sk=e.target.closest('.skillbtn'); if(sk){ startGame(sk.dataset.skill); return; }
    const bk=e.target.closest('[data-backup]'); if(bk){ exportClaims(); return; }
    if(e.target.matches('textarea,input')) return;
    const a=e.target.closest('[data-note],[data-tab],[data-grp],[data-back],[data-claim],[data-act]'); if(!a||a.dataset.actdo==='note') return; e.preventDefault(); if(a.dataset.back) back(); else if(a.dataset.claim!==undefined){ pickClaim(a); } else if(a.dataset.act!==undefined){ actDo(a.dataset.act,a.dataset.actdo); } else if(a.dataset.note!==undefined) go({note:a.dataset.note}); else if(a.dataset.grp) go({tab:a.dataset.tab,grp:a.dataset.grp}); else go({tab:a.dataset.tab});
  });
  document.addEventListener('change', e=>{
    const f=e.target.closest('[data-filter]'); if(!f) return;
    cardFilter[f.dataset.filter]=f.value; render();
  });
  function actDo(k,doWhat){
    if(doWhat==='1'){ const p=progOf(k); p.done=!p.done; setProg(k,p); render(); }
    else if(doWhat==='inc'||doWhat==='dec'){ const p=progOf(k); p.count=Math.max(0,p.count+(doWhat==='inc'?1:-1)); setProg(k,p); render(); }
    else if(doWhat==='streak'){ const o=lsGet(LS_K.streak,{last:'',days:0}); const t=todayStr(); if(o.last!==t){ const y=new Date(Date.now()-864e5); const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+y.getDate(); o.days=(o.last===ys)?(o.days||0)+1:1; o.last=t; lsSet(LS_K.streak,o); render(); } }
  }
  document.addEventListener('change',e=>{ const a=e.target.closest('[data-actdo="note"]'); if(a&&a.dataset.act){ const p=progOf(a.dataset.act); p.note=a.value; setProg(a.dataset.act,p); } });
  // 补充框随手记，不重渲染，免得打字时掉焦点
  document.addEventListener('input',e=>{
    const t=e.target.closest('[data-claimnote]'); if(!t) return;
    setClaimNote(t.dataset.claimnote,t.value);
    refreshClaimHint(t.parentElement,t.dataset.claimnote);
  });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ document.getElementById('lightbox').classList.remove('show'); document.getElementById('modal').classList.remove('show'); } if(e.key!=='Enter'&&e.key!==' ') return; if(e.target.matches('textarea,input')) return; const a=e.target.closest('[data-note],[data-tab],[data-grp]'); if(!a) return; e.preventDefault(); if(a.dataset.note!==undefined) go({note:a.dataset.note}); else if(a.dataset.grp) go({tab:a.dataset.tab,grp:a.dataset.grp}); else go({tab:a.dataset.tab}); });
  function render(){
    const main=document.getElementById('main');
    [...nav.children].forEach(b=>b.classList.toggle('on', b.textContent===state.tab && !state.note));
    if(state.note){ main.innerHTML=noteView(state.note); window.scrollTo(0,0); return; }
    const t = tabs.find(x=>x[0]===state.tab) || tabs[0];
    main.innerHTML = t[1]();
    if(state.grp && !state.note) window.scrollTo(0,0);
  }
  function switchSub(name){
    if(!subjects || !subjects[name]) return;
    const keepGrp=state.grp, keepNote=state.note;
    curSub = name;
    [...subbar.children].forEach(b=>b.classList.toggle('on', b.textContent===name));
    mount(subjects[name], state.tab);
    if(keepGrp && state.grp!==keepGrp) state.grp=keepGrp;
    if(keepNote && state.note!==keepNote) state.note=keepNote;
    render();
    try{ history.replaceState(null,'','#'+(state.note?'sub='+encodeURIComponent(name)+'&note='+encodeURIComponent(state.note):'sub='+encodeURIComponent(name)+'&tab='+encodeURIComponent(state.tab)+(state.grp?'&grp='+encodeURIComponent(state.grp):''))); }catch(e){}
  }
  (function(){ const h=location.hash.slice(1); h.split('&').forEach(p=>{const [k,v]=p.split('='); if(k==='sub') state.sub=decodeURIComponent(v||''); if(k==='tab') state.tab=decodeURIComponent(v||'总览'); if(k==='note') state.note=decodeURIComponent(v||''); if(k==='grp') state.grp=decodeURIComponent(v||'');}); })();
  if(subjects){
    subjectOrder.forEach(name=>{ const b=document.createElement('button'); b.textContent=name; b.onclick=()=>switchSub(name); subbar.appendChild(b); });
    subbar.style.display='flex';
    switchSub(subjectOrder.includes(state.sub) ? state.sub : subjectOrder[0]);
  } else {
    mount(raw);
  }
})();
</script>
</body>
</html>
